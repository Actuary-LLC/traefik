version: '3.9'

networks:
  reverse-proxy:
    driver: overlay
    external: true
configs:
  static:
    name: static_configuration_${TAG}
    file: ./static.yaml
  dynamic:
    name: dynamic_configuration_${TAG}
    file: ./dynamic.yaml
    
services:
  main:
    hostname: traefik
    image: traefik:3.6.4 #https://hub.docker.com/_/traefik/tags
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    command:
      - "--configFile=/etc/traefik/static.yaml"
    configs:
      - source: static
        target: /etc/traefik/static.yaml
      - source: dynamic
        target: /etc/traefik/dynamic/config.yaml
    ports:
      # Published in host mode so traefik sees the real client IP. The default
      # swarm routing mesh source-NATs all inbound traffic to the ingress IP
      # (10.0.0.2), making LAN and WAN clients indistinguishable - which breaks
      # the lan-only ipAllowList middleware and pollutes access logs.
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 34197
        published: 34197
        protocol: udp
        mode: host
      - target: 8211
        published: 8211
        protocol: udp
        mode: host
      - target: 8211
        published: 8211
        protocol: tcp
        mode: host
      - target: 8080
        published: 8080
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/docker/volumes/traefik/:/mnt/user/docker/volumes/traefik/
    networks:
      - reverse-proxy
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.reverse-proxy_traefik.loadbalancer.server.port=80"
        - "traefik.http.services.reverse-proxy_traefik.loadbalancer.server.port=443"
        - "traefik.http.services.reverse-proxy_traefik.loadbalancer.server.port=8080" #Necessary for access to the web console
        - "traefik.swarm.network=reverse-proxy"
        - "traefik.http.routers.dashboard.rule=(Host(`traefik.lan`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`)))"
        - "traefik.http.routers.dashboard.entrypoints=web"
        - "traefik.http.routers.dashboard.service=api@internal"
        - "traefik.http.routers.dashboard.middlewares=lan-only@file"
        ## Homepage
        - homepage.group=Security
        - homepage.name=Traefik
        - homepage.icon=traefik.png
        - homepage.href=http://192.168.2.3:8080
        - homepage.description=Reverse Proxy
        - homepage.widget.type=traefik
        - homepage.widget.url=http://192.168.2.3:8080
        #- homepage.widget.key=${HOMEPAGE_API_TOKEN}
        #- homepage.widget.fields=["users"]
        ## DIUN
        - diun.enable=true
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
