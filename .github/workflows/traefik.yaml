name: 'traefik'
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "traefik.yaml"
      - "static.yaml"
      - ".github/workflows/traefik.yaml"
jobs:
  traefik:
    runs-on: [coral]
    env:
      TAG: ${{ github.sha }}
      CF_DNS_API_TOKEN: "${{ secrets.CF_DNS_API_TOKEN }}"
      STACK_NAME: traefik
      SERVICE_NAME: traefik_main
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: Actuary-LLC/traefik
          ref: main
      - name: Update traefik stack
        run: |
          docker stack deploy -c traefik.yaml "$STACK_NAME"
      - name: Wait for convergence
        run: |
          for i in $(seq 1 30); do
            REPLICAS=$(docker service ls \
              --filter "name=${SERVICE_NAME}" \
              --format "{{.Replicas}}")
            [ "$REPLICAS" = "1/1" ] && echo "✅ Done" && exit 0
            echo "Waiting... ($i/30) — $REPLICAS"
            if [ "$i" -eq 5 ] || [ $((i % 10)) -eq 0 ]; then
              docker service ps "${SERVICE_NAME}" --no-trunc --filter "desired-state=running" 2>/dev/null || true
              docker service logs --tail 30 "${SERVICE_NAME}" 2>/dev/null || true
            fi
            sleep 5
          done
          echo "--- Timeout, rolling back ---"
          docker service rollback "${SERVICE_NAME}"
          exit 1
